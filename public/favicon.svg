<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dentalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0369a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Arka Plan: Yumuşak Köşeli Medikal Mavi Gradyan -->
  <rect width="64" height="64" rx="16" fill="url(#dentalGrad)" />

  <!-- Üst Cam Parlaması Efekti -->
  <rect width="64" height="32" rx="16" fill="url(#shineGrad)" />

  <!-- İç Kenarlık -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />

  <!-- Merkez Diş Logosu -->
  <g transform="translate(14, 14) scale(1.5)" filter="url(#dropShadow)">
    <path d="M7 2C4.5 2 3 4 3 6.5C3 9 4.2 12.5 5 15.5C5.8 18.5 6.5 22 8 22C9.5 22 10 19 11 15C11.5 13 12.5 13 13 15C14 19 14.5 22 16 22C17.5 22 18.2 18.5 19 15.5C19.8 12.5 21 9 21 6.5C21 4 19.5 2 17 2C15 2 13.5 3.5 12 3.5C10.5 3.5 9 2 7 2Z" fill="#ffffff" />
  </g>

  <!-- Sağ Üst Klinik Parlaklık Yıldızı -->
  <path d="M48 9 L49.2 12.8 L53 14 L49.2 15.2 L48 19 L46.8 15.2 L43 14 L46.8 12.8 Z" fill="#ffffff" opacity="0.95" />
  <circle cx="54" cy="9" r="1.5" fill="#ffffff" opacity="0.85" />
</svg>
